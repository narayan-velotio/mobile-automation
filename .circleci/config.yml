version: 2.1

jobs:
  test-mobile-automation:
    docker:
      - image: cimg/node:20.11
    environment:
      BROWSERSTACK_USERNAME: $BROWSERSTACK_USERNAME
      BROWSERSTACK_ACCESS_KEY: $BROWSERSTACK_ACCESS_KEY
    steps:
      - checkout
      
      - run:
          name: Install dependencies
          command: npm install
      
      - run:
          name: Run mobile automation tests on BrowserStack
          command: |
            # Debug: Check if credentials are set
            echo "Checking BrowserStack credentials..."
            echo "Raw BROWSERSTACK_USERNAME: $BROWSERSTACK_USERNAME"
            echo "Raw BROWSERSTACK_ACCESS_KEY: ${BROWSERSTACK_ACCESS_KEY:0:5}***"
            
            if [ -z "$BROWSERSTACK_USERNAME" ]; then
              echo "ERROR: BROWSERSTACK_USERNAME is not set"
              exit 1
            fi
            if [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
              echo "ERROR: BROWSERSTACK_ACCESS_KEY is not set"
              exit 1
            fi
            
            echo "BrowserStack credentials are set (masked for security)"
            echo "Username: ${BROWSERSTACK_USERNAME:0:3}***"
            echo "Access Key: ${BROWSERSTACK_ACCESS_KEY:0:5}***"
            
            # Verify environment variables are set
            echo "Verifying environment variables..."
            echo "BROWSERSTACK_USERNAME length: ${#BROWSERSTACK_USERNAME}"
            echo "BROWSERSTACK_ACCESS_KEY length: ${#BROWSERSTACK_ACCESS_KEY}"
            
            # Run tests on BrowserStack
            npm run test:browserstack
      
      - store_test_results:
          path: allure-results
      
      - store_artifacts:
          path: allure-report
          destination: allure-report
      
      - store_artifacts:
          path: screenshots
          destination: screenshots
      
      - store_artifacts:
          path: logs
          destination: logs

workflows:
  build-and-test:
    jobs:
      - test-mobile-automation
